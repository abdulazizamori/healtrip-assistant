services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: healtrip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password   # local only
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro       # 01 schema -> 02 seed -> 03 read-only role
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healtrip"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      DATABASE_URL: postgresql://healtrip_agent_ro:readonly_dev_password@db:5432/healtrip
      ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
